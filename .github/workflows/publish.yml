name: Publish

on:
  push:
    branches: [master]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Targets .NET Framework 4.8 (built into Windows), so the output is a single small exe.
      - name: Build
        run: dotnet build MonitorSwitcher/MonitorSwitcher.csproj -c Release

      - name: Get short commit SHA
        id: vars
        shell: bash
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.short_sha }}
          name: Build ${{ steps.vars.outputs.short_sha }}
          files: MonitorSwitcher/bin/Release/net48/MonitorSwitcher.exe
